<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="《从读研到做研究》12周科研学术入门训练计划，按周学习文献检索、数据分析、科研设计、论文写作，并保存本地打卡进度。"><title>12周科研入门训练｜从读研到做研究</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/plan.css"><script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("gradbook:theme"))||"light"}catch(e){}</script></head><body><header><a href="./" class="brand"><span class="brandmark">研</span>从读研到做研究</a><div class="actions"><a class="home-link" href="./">全书目录</a><a class="home-link" href="resources.html">科研模板</a><button class="btn" id="plan-theme">◐ 模式</button></div></header><main class="wrap study-wrap"><section class="study-hero"><div class="eyebrow">A STUDY PATH · 12 WEEKS</div><h1>把阅读变成训练，<br>让能力留下作品。</h1><p>这份12周计划将五十章拆成每周可完成的任务。每周只要求三项有明确交付结果的练习；可以根据课程、工作和研究条件调整节奏，不必为了打卡牺牲真实的思考。</p></section><section class="study-progress"><div class="study-meter"><div class="study-status" id="plan-count">正在载入学习计划</div><div class="study-meter-bar"><div id="plan-bar"></div></div></div><button class="btn" id="plan-export">导出我的打卡记录 .md ↗</button></section><div class="study-grid" id="week-grid"></div><div class="study-note"><strong>使用说明：</strong>打卡保存在当前浏览器，不需要登录，也不会上传到服务器。清除浏览器数据或更换设备前，请使用“导出”自行备份。计划适合从零开始学习的读者，也可以跳过已掌握的内容。政策与伦理要求仍须以对应学校或机构的正式规定为准。</div></main><footer class="wrap"><span>© 2026 一心问道 · 《从读研到做研究》</span><span><a href="./">返回全书目录</a> · <a href="resources.html">下载科研模板</a></span></footer><script id="plan-data" type="application/json">[{"title":"认识读研与研究","range":"第1—3章","chap":[1,2,3],"focus":"理解研究生教育与科研共同体，而不是急于使用高级工具。","tasks":["写出一页个人读研动机与职业目标说明","画一张研究团队与科研成果的关系图","比较学硕、专硕和博士项目的培养目标"]},{"title":"专业与导师选择","range":"第4—10章","chap":[4,7,10],"focus":"把学校声誉、真实研究任务与个人基础放在同一张比较表里。","tasks":["调查三个正式招生项目并保存原始链接","精读两篇潜在导师团队的真实论文","写一封包含具体研究匹配的联系邮件草稿"]},{"title":"进入研究生的前90天","range":"第11—15章","chap":[11,12,15],"focus":"建立工作环境、安全意识和稳定的研究记录习惯。","tasks":["绘制入学前与第一学期的能力清单","建立研究项目文件夹与README","完成一份可检查的周报和组会纪要"]},{"title":"学会检索文献","range":"第16章","chap":[16],"focus":"从一个真实研究问题出发，而不是只使用宽泛的关键词。","tasks":["为研究问题建立同义词与主题词表","在两个适用数据库记录完整检索式","筛选三十条候选文献记录并保存来源"]},{"title":"深入阅读原创论文","range":"第17—18章","chap":[17,18],"focus":"能够将作者的主张、具体证据与自己的判断分开。","tasks":["按三遍阅读法精读一篇原创论文","拆解其一张主要图和一项方法决策","使用模板建立不少于十篇文献的比较表"]},{"title":"证据评价与研究空白","range":"第19—20章","chap":[19,20],"focus":"比较不一致的研究证据并找到真正值得继续检验的问题。","tasks":["挑选三篇相关研究比较其设计局限","制作一张研究证据矩阵","提出两个可能的研究空白并说明重要性"]},{"title":"提出科研问题","range":"第21—22章","chap":[21,22],"focus":"将宽泛兴趣变成对象、变量和证据类型都清楚的研究问题。","tasks":["形成五个候选研究问题","为最可行的一个问题绘制概念框架","写出主要变量的操作性定义及限制"]},{"title":"完成研究设计","range":"第23—26章","chap":[23,24,25,26],"focus":"让研究方案真正能够在现有资源和伦理条件下实施。","tasks":["比较两种可以回答问题的研究设计","完成样本来源、偏倚与可行性检查","形成一份五页研究方案或开题报告"]},{"title":"规范实验与数据","range":"第27—28章","chap":[27,28],"focus":"保证所有处理步骤能够从真实记录回溯。","tasks":["建立实验或数据处理日志","用教学数据制作变量字典与清洗脚本","记录两项异常的判断过程及处理依据"]},{"title":"统计与模型验证","range":"第29—33章","chap":[29,30,31,33],"focus":"避免只追求显著结果或最高预测指标。","tasks":["说明一个统计检验的前提和效应量解释","运行本书模拟数据的Python或R练习","制作一份包含主要结果与局限的分析报告"]},{"title":"写作与学术投稿","range":"第34—40章","chap":[34,36,38,40],"focus":"让研究问题、方法、图表与结论互相对应。","tasks":["用三张图搭建原创研究的Results结构","写出一版准确的标题和结构化摘要","模拟回应一条方法质疑和一条补实验意见"]},{"title":"科研规范与未来","range":"第41—50章","chap":[41,42,46,49,50],"focus":"建立可持续、诚实并能适应不同职业路径的科研能力。","tasks":["完成一份科研诚信与AI使用核验表","梳理学位论文里程碑和职业作品集","给未来一年后的自己写一份成长评估信"]}]</script><script src="assets/plan.js" defer></script></body></html>
