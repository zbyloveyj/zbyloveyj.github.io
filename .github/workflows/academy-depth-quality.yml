name: Academy workbook quality
on:
  push:
    branches: [main]
    paths:
      - 'personal-growth-lab/academy/index.html'
      - 'personal-growth-lab/academy/assets/depth*'
      - 'personal-growth-lab/academy/assets/workbook*'
      - 'personal-growth-lab/academy/tools/*workbook*'
      - '.github/workflows/academy-depth-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-detailed-quality
  cancel-in-progress: true
jobs:
  detailed-course:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKBOOK_QA_DIR: /tmp/academy-workbook-qa
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NODE_PATH: /tmp/academy-workbook-deps/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: personal-growth-lab/academy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all scripts and 839 workbook lessons
        run: |
          for file in personal-growth-lab/academy/assets/*.js; do node --check "$file"; done
          node personal-growth-lab/academy/tools/check_workbook.cjs
      - name: Install CPU teaching and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scikit-learn matplotlib
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          npm install --prefix /tmp/academy-workbook-deps playwright
          /tmp/academy-workbook-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute 48 programming examples and 11 chart programs
        run: python personal-growth-lab/academy/tools/test_workbook_runtime.py
      - name: Test full content, downloads, records, print and responsive reading
        run: node personal-growth-lab/academy/tools/test_workbook_browser.cjs
      - name: Verify public Pages entrypoint and every loaded asset
        run: python personal-growth-lab/academy/tools/verify_live_workbook.py
      - name: Upload reports, textbook content, reference figures and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-workbook-qa
          path: /tmp/academy-workbook-qa
          if-no-files-found: warn
          retention-days: 7
