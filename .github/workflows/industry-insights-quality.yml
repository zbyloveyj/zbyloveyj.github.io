name: Validate industry insights
on:
  push:
    branches: [main]
    paths:
      - 'industry-insights/**'
      - 'index.html'
      - 'personal-growth-lab/index.html'
      - 'personal-growth-lab/academy/index.html'
      - '.github/workflows/industry-insights-quality.yml'
  pull_request:
    paths:
      - 'industry-insights/**'
      - '.github/workflows/industry-insights-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dates, evidence, capital bases, archives and links
        run: python3 industry-insights/tools/validate.py
