# GitHub Pages is currently deployed from the main branch by GitHub's
# built-in "pages build and deployment" workflow. Do not deploy a second
# Pages artifact from here: concurrent deployments conflict.
name: Validate academic homepage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate academic pages and handbook
        run: |
          python3 tests/validate_site.py
          python3 tests/validate_handbook.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/data.js
          node --check assets/site.js
          node --check assets/v3.js
          node --check graduate-research-handbook/assets/app.js
          node --check graduate-research-handbook/assets/search.js
      - name: Check staged GitHub profile README
        run: |
          test -s github-profile/README.md
          test -s github-profile/index.html
          test -s github-profile/assets/profile-banner-light.svg
          test -s github-profile/assets/profile-banner-dark.svg
