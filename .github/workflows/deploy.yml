name: Deploy academic homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academic-homepage-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files and bibliography
        run: python3 tests/validate_site.py
      - name: Verify frontend JavaScript syntax
        run: |
          node --check assets/data.js
          node --check assets/site.js
          node --check assets/v3.js
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp *.html sitemap.xml robots.txt .nojekyll _site/
          cp -r assets _site/assets
          cp -r graduate-research-handbook _site/graduate-research-handbook
          test -f _site/graduate-research-handbook/index.html
          test -f _site/assets/editorial-v4.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
