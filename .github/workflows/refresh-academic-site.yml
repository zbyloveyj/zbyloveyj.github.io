name: Publish four-book academic website
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_academic_site.py'
      - '.github/workflows/refresh-academic-site.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academic-four-book-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Synchronize and validate website
        run: python .github/scripts/refresh_academic_site.py
      - name: Commit generated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects.html books.html sitemap.xml assets/site.js assets/editorial-v4.css assets/books/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish four-book website: homepage, catalog, navigation and responsive fixes'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: academic-site-updated
          retention-days: 3
          path: |
            index.html
            projects.html
            books.html
            sitemap.xml
            assets/
