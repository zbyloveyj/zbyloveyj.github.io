name: Ukulele classroom quality
on:
  push:
    branches: [main]
    paths:
      - 'personal-growth-lab/academy/ukulele-lab/**'
      - 'personal-growth-lab/academy/assets/ukulele-bridge.js'
      - 'personal-growth-lab/academy/index.html'
      - '.github/workflows/ukulele-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ukulele-classroom-quality
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: personal-growth-lab/academy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all course data, chord spellings and scoring gates
        run: |
          node personal-growth-lab/academy/tools/validate.js --full-catalog
          for file in personal-growth-lab/academy/ukulele-lab/assets/*.js; do node --check "$file"; done
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check daily tasks, persistence, quizzes, assessment, audio, mobile and print
        run: python personal-growth-lab/academy/ukulele-lab/tools/browser_check.py
      - name: Preserve test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukulele-classroom-qa
          path: /tmp/ukulele-qa
          retention-days: 7
          if-no-files-found: warn
