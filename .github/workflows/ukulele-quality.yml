name: Ukulele classroom quality
on:
  push:
    branches: [main]
    paths:
      - 'personal-growth-lab/academy/ukulele-lab/**'
      - 'personal-growth-lab/academy/assets/ukulele-bridge.js'
      - 'personal-growth-lab/academy/index.html'
      - '.github/workflows/ukulele-quality.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'personal-growth-lab/academy/ukulele-lab/**'
      - 'personal-growth-lab/academy/assets/ukulele-bridge.js'
      - 'personal-growth-lab/academy/index.html'
      - '.github/workflows/ukulele-quality.yml'
permissions:
  contents: read
concurrency:
  group: ukulele-classroom-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: personal-growth-lab/academy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate course data, complete score forms and scoring gates
        run: |
          node personal-growth-lab/academy/tools/validate.js --full-catalog
          for file in personal-growth-lab/academy/ukulele-lab/assets/*.js; do node --check "$file"; done
          PYTHONPYCACHEPREFIX=/tmp/ukulele-py-cache python -m py_compile personal-growth-lab/academy/ukulele-lab/tools/browser_check.py
      - name: Check real DSP fixtures, ZIP audio roundtrip and score-player timing
        run: |
          node personal-growth-lab/academy/ukulele-lab/tools/test_audio_analysis.cjs --performance
          node personal-growth-lab/academy/ukulele-lab/tools/test_v2.cjs
          node personal-growth-lab/academy/ukulele-lab/tools/test_score_notation.cjs
          node personal-growth-lab/academy/ukulele-lab/tools/test_cloud_sync.cjs
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check real media capture, analysis, IndexedDB, audio ZIP restore, score playback and mobile lessons
        timeout-minutes: 10
        run: python personal-growth-lab/academy/ukulele-lab/tools/browser_check.py
      - name: Preserve test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukulele-classroom-qa
          path: /tmp/ukulele-qa
          retention-days: 7
          if-no-files-found: warn
