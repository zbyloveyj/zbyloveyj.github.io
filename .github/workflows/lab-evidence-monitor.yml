name: Lab evidence monitor
on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Beijing; GitHub may queue scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-evidence-monitor.yml'
      - 'personal-growth-lab/academy/data/labs.json'
      - 'personal-growth-lab/academy/data/labs.json.gz'
      - 'personal-growth-lab/academy/data/lab-records-*.json'
      - 'personal-growth-lab/academy/data/lab-records-*.json.gz'
      - 'personal-growth-lab/academy/data/lab-sources.json'
      - 'personal-growth-lab/academy/data/lab-editorial-overrides.json'
      - 'personal-growth-lab/academy/data/lab-source-additions-2026-10-26.json'
      - '.github/lab-directory/apply_source_additions.py'
      - '.github/lab-directory/test_apply_source_additions.py'
      - 'personal-growth-lab/academy/tools/monitor_labs.py'
      - 'personal-growth-lab/academy/tools/lab_data.py'
      - 'personal-growth-lab/academy/tools/load_lab_data.cjs'
      - 'personal-growth-lab/academy/tools/test_labs.py'
      - 'personal-growth-lab/academy/tools/test_labs_browser.cjs'
      - 'personal-growth-lab/academy/tools/test_lab_model.cjs'
      - 'personal-growth-lab/academy/tools/test_lab_discovery.cjs'
      - 'personal-growth-lab/academy/tools/test_labs_workspace.cjs'
      - 'personal-growth-lab/academy/assets/labs.*'
      - 'personal-growth-lab/academy/assets/lab-model.js'
      - 'personal-growth-lab/academy/assets/lab-taxonomy.js'
      - 'personal-growth-lab/academy/assets/lab-discovery.js'
      - 'personal-growth-lab/academy/labs.html'
      - '.github/lab-directory/enrich_candidates.py'
      - '.github/lab-directory/test_enrich_candidates.py'
permissions:
  contents: write
concurrency:
  group: lab-evidence-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply editorial source additions
        run: python .github/lab-directory/apply_source_additions.py
      - name: Test source-addition merge idempotence
        run: python .github/lab-directory/test_apply_source_additions.py
      - name: Validate editorial data and monitor rules
        run: |
          python personal-growth-lab/academy/tools/test_labs.py
          python .github/lab-directory/test_enrich_candidates.py
      - name: Check official sources
        run: python personal-growth-lab/academy/tools/monitor_labs.py --max-profiles 96
      - name: Persist only public monitor state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal-growth-lab/academy/data/lab-monitor.json personal-growth-lab/academy/data/lab-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(academy): refresh public lab source monitor"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  browser-quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify course compatibility and script syntax
        run: |
          node --check personal-growth-lab/academy/assets/labs.js
          node --check personal-growth-lab/academy/assets/lab-model.js
          node --check personal-growth-lab/academy/assets/lab-taxonomy.js
          node --check personal-growth-lab/academy/assets/lab-discovery.js
          node personal-growth-lab/academy/tools/test_lab_model.cjs
          node personal-growth-lab/academy/tools/test_lab_discovery.cjs
          node personal-growth-lab/academy/tools/check_workbook.cjs
      - name: Prepare browser test
        run: |
          npm install --prefix /tmp/lab-browser-deps playwright
          /tmp/lab-browser-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Test filters, comparison, freshness and responsive layout
        env:
          NODE_PATH: /tmp/lab-browser-deps/node_modules
        run: |
          node personal-growth-lab/academy/tools/test_labs_browser.cjs
          node personal-growth-lab/academy/tools/test_labs_workspace.cjs

