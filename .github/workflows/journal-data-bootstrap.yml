name: Install verified journal catalog
on:
  push:
    branches: [main]
    paths:
      - personal-growth-lab/academy/journals/release/manifest.json
permissions:
  contents: write
concurrency:
  group: journal-data-bootstrap
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/journal-bootstrap/
            /personal-growth-lab/academy/journals/
      - name: Verify and install the exact data release
        run: python .github/journal-bootstrap/install.py
      - name: Commit verified data and remove temporary upload chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- personal-growth-lab/academy/journals/data
          git rm --sparse -r -- personal-growth-lab/academy/journals/release
          git commit -m 'data(journals): install validated full catalog and source snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
