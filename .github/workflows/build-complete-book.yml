name: Build complete research handbook
on:
  push:
    branches: [main]
    paths:
      - "graduate-research-handbook/tools/build_book.py"
      - "graduate-research-handbook/tools/sync_book.py"
      - "graduate-research-handbook/content/**"
      - "graduate-research-handbook/data/catalog.json"
      - "graduate-research-handbook/downloads/complete-manuscript.md"
      - ".github/handbook-release/**"
      - ".github/workflows/build-complete-book.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-handbook-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install Chinese typefaces and publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          python3 -m pip install --user markdown beautifulsoup4 weasyprint python-docx pypdf playwright
          python3 -m playwright install --with-deps chromium
      - name: Import the reviewed October edition
        run: python3 .github/handbook-release/publish.py
      - name: Synchronize chapter source and search indexes
        run: python3 graduate-research-handbook/tools/sync_book.py
      - name: Build complete PDF and Word
        run: python3 graduate-research-handbook/tools/build_book.py
      - name: Verify all chapters and reader behavior
        run: |
          node --check graduate-research-handbook/assets/app.js
          node --check graduate-research-handbook/assets/edition.js
          node --check graduate-research-handbook/assets/search.js
          python3 .github/handbook-release/check_site.py
          python3 graduate-research-handbook/tools/sync_book.py --check
      - name: Save complete web edition and downloads
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A graduate-research-handbook
          if ! git diff --staged --quiet; then
            git commit -m "Publish revised October reader, chapters and downloads [skip ci]"
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Published book commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public Pages edition and matching download files
        run: python3 .github/handbook-release/check_site.py --live
      - name: Upload publication and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handbook-october-edition-and-reader-checks
          path: |
            graduate-research-handbook/downloads/complete-book.pdf
            graduate-research-handbook/downloads/complete-book.docx
            graduate-research-handbook/downloads/complete-manuscript.md
            ${{ runner.temp }}/handbook-qa/
          retention-days: 30
