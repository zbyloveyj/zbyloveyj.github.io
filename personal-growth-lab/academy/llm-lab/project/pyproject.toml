[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curatemicrobiota-learning"
version = "1.1.0"
description = "A small, inspectable language-model and microbiome representation learning course project"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3.0", "numpy>=1.24,<3.0", "scikit-learn>=1.3,<2.0"]

[project.scripts]
curatemicrobiota = "curatemicrobiota.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["curatemicrobiota*"]

[tool.setuptools.package-data]
curatemicrobiota = ["sft_pairs.jsonl", "evidence_cards.json"]
